<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signs Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2d3748;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1a202c;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: #e2e8f0;
            margin-bottom: 30px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            margin-right: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .results-section {
            display: none;
            margin-top: 30px;
        }

        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .predictions {
            background: #2d3748;
            padding: 20px;
            border-radius: 5px;
        }

        .predictions>h3 {
            color: #e2e8f0;
            margin-bottom: 15px;
        }

        .prediction-item {
            background: #4a5568;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .prediction-item h3 {
            color: #90cdf4;
            margin-bottom: 5px;
        }

        .prediction-item p {
            color: #e2e8f0;
            margin: 5px 0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #e2e8f0;
        }

        .spinner {
            border: 4px solid #4a5568;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #fc8181;
            color: #1a202c;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .file-name {
            display: inline-block;
            margin-left: 10px;
            color: #cbd5e0;
        }

        .results-section h2 {
            color: #e2e8f0;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚦 Traffic Signs Detection</h1>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <label for="fileInput" class="btn btn-primary">Choose Image</label>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <button id="uploadBtn" class="btn btn-success" disabled>Run Detection</button>
            <span class="file-name" id="fileName"></span>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing image...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results-section" id="results">
            <h2>Results</h2>
            <div class="image-container">
                <img id="resultImage" src="" alt="Annotated Image">
            </div>
            <div class="predictions" id="predictions"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const resultImage = document.getElementById('resultImage');
        const predictions = document.getElementById('predictions');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = e.target.files[0].name;
                uploadBtn.disabled = false;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            loading.style.display = 'block';
            error.style.display = 'none';
            results.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                resultImage.src = 'data:image/png;base64,' + data.annotated_image;

                predictions.innerHTML = `<h3>Detected ${data.count} object(s)</h3>`;

                data.predictions.forEach((pred, index) => {
                    const item = document.createElement('div');
                    item.className = 'prediction-item';
                    item.innerHTML = `
                        <h3>Detection ${index + 1}</h3>
                        <p><strong>Class:</strong> ${pred.class}</p>
                        <p><strong>Confidence:</strong> ${(pred.confidence * 100).toFixed(2)}%</p>
                        <p><strong>Position:</strong> x=${pred.x.toFixed(1)}, y=${pred.y.toFixed(1)}</p>
                        <p><strong>Size:</strong> ${pred.width.toFixed(1)}x${pred.height.toFixed(1)}</p>
                    `;
                    predictions.appendChild(item);
                });

                results.style.display = 'block';

            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>

</html>
